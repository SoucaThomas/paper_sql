services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image; runs under Rosetta on Apple Silicon
    container_name: paper_sql_db
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - '${DB_PORT:-1433}:1433'
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mssql_data:
